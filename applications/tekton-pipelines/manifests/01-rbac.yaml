apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-ci
  namespace: tekton-pipelines
secrets:
  - name: github-deploy-key
---
# The EventListener pod needs the upstream aggregated roles shipped by the
# Tekton operator. A hand-rolled Role is insufficient: the listener watches
# triggers and interceptors (namespaced) plus clusterinterceptors and
# clustertriggerbindings, which are cluster-scoped and cannot be granted
# by a namespaced Role at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-ci-eventlistener-roles
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-ci
    namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-ci-eventlistener-clusterroles
subjects:
  - kind: ServiceAccount
    name: tekton-ci
    namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
