# ExternalSecret definitions for the OpenConveyor smoke test.
#
# Both target Secret names and inner key names are load-bearing — the
# reference agents (claude-code-implementer, claude-code-reviewer) discover
# them by directory layout under /run/secrets/<name>/<key> and turn them
# into env vars by upper-casing the Secret name. Renaming either side
# breaks ANTHROPIC_API_KEY / GITHUB_TOKEN export.
#
# Replace `<your-secret-store>` and the remoteRef.key paths to match your
# backend. Apply alongside the namespace; ESO will materialise the Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-api-key
  namespace: conveyor-tasks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # Renaming this breaks $ANTHROPIC_API_KEY discovery in the agent.
    name: anthropic-api-key
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: homelab/anthropic-api-key
        property: key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: conveyor-tasks
spec:
  # GitHub App installation tokens expire after 60m. Agents read the token
  # once at Job start, so a 20m mint cadence guarantees >=40m of remaining
  # validity — above the 30m max task timeout.
  refreshInterval: 20m
  target:
    # Renaming this breaks $GITHUB_TOKEN discovery in the agent.
    name: github-token
    creationPolicy: Owner
  dataFrom:
    # The generator (github-app.yaml) emits key "token", preserving the
    # /run/secrets/github-token/token path the agents expect.
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-app-token
