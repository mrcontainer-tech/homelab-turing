apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-image-registry
  annotations:
    policies.kyverno.io/title: Rewrite Images to Zot Registry
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Automatically rewrites container image references to pull through the Zot
      registry (zot.mrcontainer.nl) for caching and Trivy vulnerability scanning.
      Images are routed to the correct upstream prefix based on their source registry.
      System namespaces are excluded to avoid breaking core infrastructure.
    # Mutate Pods only, not their controllers. Workload manifests (Deployments
    # etc.) stay byte-identical to Git, so ArgoCD keeps full image drift
    # detection and the appsets need no ignoreDifferences for images.
    pod-policies.kyverno.io/autogen-controllers: "none"
spec:
  admission: true
  background: true
  emitWarning: false
  validationFailureAction: Audit
  rules:
    # Docker Hub implicit - official library images (no domain, no slash, e.g. nginx:latest)
    # The match/exclude/preconditions blocks are YAML-anchored here and reused
    # by every rule below — edit them in one place only.
    - name: rewrite-dockerhub-library
      match: &match-pods
        any:
          - resources:
              kinds:
                - Pod
      exclude: &exclude-system-namespaces
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - argocd
                - cert-manager
                - cloudnativepg
                - coredns
                - dnscrypt-proxy
                - external-dns
                - external-secrets
                - kube-prometheus-stack
                - kyverno
                - longhorn-system
                - metallb-system
                - policy-reporter
                - tailscale
                - tekton-operator
                - tekton-pipelines
                - zot
      preconditions: &on-create-update
        all:
          - key: "{{request.operation}}"
            operator: In
            value: ["CREATE", "UPDATE"]
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-dockerhub-library
              all:
                - key: "{{element.image}}"
                  operator: NotEquals
                  value: "zot.mrcontainer.nl/*"
                - key: "{{element.image}}"
                  operator: NotEquals
                  value: "*.*/*"
                - key: "{{element.image}}"
                  operator: NotEquals
                  value: "*/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "zot.mrcontainer.nl/dockerhub/library/{{element.image}}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-dockerhub-library
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "zot.mrcontainer.nl/dockerhub/library/{{element.image}}"
    # Docker Hub implicit - namespaced images (no domain, has slash, e.g. miniflux/miniflux:2.2.6)
    - name: rewrite-dockerhub-namespaced
      match: *match-pods
      exclude: *exclude-system-namespaces
      preconditions: *on-create-update
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-dockerhub-namespaced
              all:
                - key: "{{element.image}}"
                  operator: NotEquals
                  value: "zot.mrcontainer.nl/*"
                - key: "{{element.image}}"
                  operator: NotEquals
                  value: "*.*/*"
                - key: "{{element.image}}"
                  operator: Equals
                  value: "*/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "zot.mrcontainer.nl/dockerhub/{{element.image}}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-dockerhub-namespaced
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "zot.mrcontainer.nl/dockerhub/{{element.image}}"
    # Docker Hub explicit (docker.io/...)
    - name: rewrite-dockerhub-explicit
      match: *match-pods
      exclude: *exclude-system-namespaces
      preconditions: *on-create-update
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-dockerhub-explicit
              all:
                - key: "{{element.image}}"
                  operator: Equals
                  value: "docker.io/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^docker\\.io/', element.image, 'zot.mrcontainer.nl/dockerhub/') }}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-dockerhub-explicit
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^docker\\.io/', element.image, 'zot.mrcontainer.nl/dockerhub/') }}"
    # GHCR (ghcr.io)
    - name: rewrite-ghcr
      match: *match-pods
      exclude: *exclude-system-namespaces
      preconditions: *on-create-update
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-ghcr
              all:
                - key: "{{element.image}}"
                  operator: Equals
                  value: "ghcr.io/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^ghcr\\.io/', element.image, 'zot.mrcontainer.nl/ghcr/') }}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-ghcr
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^ghcr\\.io/', element.image, 'zot.mrcontainer.nl/ghcr/') }}"
    # Quay (quay.io)
    - name: rewrite-quay
      match: *match-pods
      exclude: *exclude-system-namespaces
      preconditions: *on-create-update
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-quay
              all:
                - key: "{{element.image}}"
                  operator: Equals
                  value: "quay.io/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^quay\\.io/', element.image, 'zot.mrcontainer.nl/quay/') }}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-quay
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^quay\\.io/', element.image, 'zot.mrcontainer.nl/quay/') }}"
    # LSCR (lscr.io)
    - name: rewrite-lscr
      match: *match-pods
      exclude: *exclude-system-namespaces
      preconditions: *on-create-update
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-lscr
              all:
                - key: "{{element.image}}"
                  operator: Equals
                  value: "lscr.io/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^lscr\\.io/', element.image, 'zot.mrcontainer.nl/lscr/') }}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-lscr
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^lscr\\.io/', element.image, 'zot.mrcontainer.nl/lscr/') }}"
    # Kubernetes registry (registry.k8s.io)
    - name: rewrite-k8s
      match: *match-pods
      exclude: *exclude-system-namespaces
      preconditions: *on-create-update
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-k8s
              all:
                - key: "{{element.image}}"
                  operator: Equals
                  value: "registry.k8s.io/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^registry\\.k8s\\.io/', element.image, 'zot.mrcontainer.nl/k8s/') }}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-k8s
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^registry\\.k8s\\.io/', element.image, 'zot.mrcontainer.nl/k8s/') }}"
    # GCR (gcr.io)
    - name: rewrite-gcr
      match: *match-pods
      exclude: *exclude-system-namespaces
      preconditions: *on-create-update
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-gcr
              all:
                - key: "{{element.image}}"
                  operator: Equals
                  value: "gcr.io/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^gcr\\.io/', element.image, 'zot.mrcontainer.nl/gcr/') }}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-gcr
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^gcr\\.io/', element.image, 'zot.mrcontainer.nl/gcr/') }}"
    # NVCR (nvcr.io)
    - name: rewrite-nvcr
      match: *match-pods
      exclude: *exclude-system-namespaces
      preconditions: *on-create-update
      mutate:
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions: &pre-nvcr
              all:
                - key: "{{element.image}}"
                  operator: Equals
                  value: "nvcr.io/*"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^nvcr\\.io/', element.image, 'zot.mrcontainer.nl/nvcr/') }}"
          - list: "request.object.spec.initContainers[] || []"
            preconditions: *pre-nvcr
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{element.name}}"
                    image: "{{ regex_replace_all('^nvcr\\.io/', element.image, 'zot.mrcontainer.nl/nvcr/') }}"
