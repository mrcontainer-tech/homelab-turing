apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # Connector (subnet router) pods need privileged for sysctls/NET_ADMIN.
    # Ingress proxy pods would pass baseline; keep warn at restricted.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
  annotations:
    # Don't prune the namespace
    argocd.argoproj.io/sync-options: Prune=false