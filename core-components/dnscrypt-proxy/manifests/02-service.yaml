---
apiVersion: v1
kind: Service
metadata:
  name: dnscrypt-proxy
  namespace: kube-system
  labels:
    app.kubernetes.io/name: dnscrypt-proxy
    app.kubernetes.io/component: dns
spec:
  type: ClusterIP
  # Pinned: the CoreDNS Corefile forwards to this IP (the forward plugin
  # cannot use DNS names). Matches the IP the Service already holds, so
  # applying this is a no-op. If this ever changes, update
  # core-components/coredns/manifests/coredns-custom.yaml in the same commit.
  clusterIP: 10.43.24.76
  selector:
    app.kubernetes.io/name: dnscrypt-proxy
  ports:
    - name: dns-udp
      port: 53
      targetPort: 5053
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 5053
      protocol: TCP
