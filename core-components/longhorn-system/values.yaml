# Use this file to override default values.yaml with custom values.yaml
csi:
  kubeletRootDir: /var/lib/kubelet

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    additionalLabels:
      # Must match the Prometheus serviceMonitorSelector, which uses the
      # kube-prometheus-stack Helm *release* name (not the ArgoCD app name).
      release: kube-prometheus-stack

persistence:
  defaultClassReplicaCount: 1

# Backup target is NOT set via defaultSettings: since Longhorn v1.8 those
# settings are ignored on existing installs. It is configured through the
# BackupTarget CR in manifests/backup-target.yaml instead.

