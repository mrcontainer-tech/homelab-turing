# Use this file to override default values.yaml with custom values.yaml
csi:
  kubeletRootDir: /var/lib/kubelet

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    additionalLabels:
      # Must match the Prometheus serviceMonitorSelector, which uses the
      # kube-prometheus-stack Helm *release* name (not the ArgoCD app name).
      release: kube-prometheus-stack

persistence:
  defaultClassReplicaCount: 1

defaultSettings:
  # Bucket + IAM user + ASM secret must exist BEFORE this syncs — see the
  # backup runbook in README.md. Secret is materialised by
  # manifests/backup-external-secret.yaml.
  backupTarget: s3://mrcontainer-homelab-backups@eu-west-1/longhorn
  backupTargetCredentialSecret: longhorn-backup-secret

